name: Build R1350 OpenWrt with WireGuard

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout r1350 repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget

      - name: Clone OpenWrt 24.10 and apply R1350 patches
        run: |
          git clone --branch openwrt-24.10 https://github.com/openwrt/openwrt.git
          cd openwrt
          git checkout 924f06e76cd73e24d39691a4de621bdcae80a756
          git apply ../patches/0001-r1350-add-dts.patch
          git apply ../patches/0002-r1350-image-leds-network.patch
          cp ../files/etc/uci-defaults/99-r1350-flow-offload \
             target/linux/ath79/generic/base-files/etc/uci-defaults/

      - name: Update feeds and configure WireGuard
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../patches/config.seed .config
          sed -i '/wireguard/d' .config
          cat << 'EOF' >> .config
          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y
          CONFIG_PACKAGE_luci-proto-wireguard=y
          CONFIG_PACKAGE_luci-i18n-wireguard-zh-cn=y
          EOF
          make defconfig
          grep -i wireguard .config

      - name: Download sources and compile
        run: |
          cd openwrt
          make -j"$(nproc)" download
          make -j"$(nproc)" || make -j1 V=s

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: R1350-OpenWrt-24.10-WireGuard
          path: |
            openwrt/bin/targets/ath79/generic/*xiaomi_mi-router-4-pro-r1350*
            openwrt/bin/targets/ath79/generic/packages/*wireguard*
